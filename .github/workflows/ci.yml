# Continuous integration: lint, format check, tests and inventory validation
# on every push and pull request. Tooling: ADR-0002. Exit statuses of
# "archinv validate": ADR-0004. Actions are pinned by commit SHA, with the
# release tag in a comment; updates are manual (see README, "Continuous
# integration").

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - name: Install Python from .python-version
        run: uv python install

      - name: Install the project from uv.lock
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Validate the inventory
        run: uv run archinv validate
