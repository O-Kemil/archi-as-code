# Continuous integration: lint, format check, inventory validation, anomaly
# report, maps and tests on every push and pull request, plus a nightly run so
# that the report is at the date of the day. The inventory is validated and the
# deliverables built before the tests, because one test loads the real
# inventory/ and would fail with a traceback. The report and the hosting map are
# shown on the run page; everything under generated/ is uploaded as the
# "deliverables" artifact; nothing is committed (ADR-0006, ADR-0007). Graphviz
# comes from apt, the one unpinned installation (ADR-0007). Tooling: ADR-0002.
# Exit statuses: ADR-0004 and ADR-0006. Actions and the runner image are
# pinned; updates are manual (see README, "Continuous integration").

name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * *" # every day at 05:17 UTC, off the busy start of the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - name: Install Python from .python-version
        run: uv python install

      - name: Install the project from uv.lock
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Validate the inventory
        run: uv run archinv validate

      - name: Build the anomaly report
        run: uv run archinv report --deadline 2028-03-31 --output generated/report.md

      - name: Build the maps
        run: |
          for view in global hosting end-of-life; do
            uv run archinv map --format mermaid --view "$view" --deadline 2028-03-31 --output "generated/map-$view.mmd"
            uv run archinv map --format dot --view "$view" --deadline 2028-03-31 --output "generated/map-$view.dot"
          done

      - name: Install Graphviz
        # The one unpinned installation of the workflow (ADR-0007, decision 6).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      - name: Render the maps to SVG
        run: |
          for file in generated/*.dot; do
            dot -Tsvg "$file" -o "${file%.dot}.svg"
          done

      - name: Show the report and the hosting map on the run page
        run: |
          cat generated/report.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "## Dependency map by hosting"
            echo
            echo '```mermaid'
            cat generated/map-hosting.mmd
            echo '```'
            echo
            echo "Dashed border: no business owner. Red: runs on a component past end of life. Orange: runs on a component reaching end of life before 2028-03-31."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the deliverables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deliverables
          path: generated/

      - name: Test
        run: uv run pytest
