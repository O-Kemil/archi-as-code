[project]
name = "archinv"
version = "0.1.0"
description = "Application inventory as code: validate a YAML inventory, build dependency maps and an anomaly report."
readme = "README.md"
authors = [
    { name = "Kemil Saadouni", email = "238448192+O-Kemil@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
archinv = "archinv:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
